user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64k;

    # No query string, request body, Authorization or Cookie in access logs.
    # Route categories also avoid user-controlled path segments in log output.
    map $uri $route_group {
        default "other";
        ~^/login$ "login";
        ~^/register$ "register";
        ~^/logout$ "logout";
        ~^/health$ "health";
        ~^/admin(?:/|$) "admin";
        ~^/exams(?:/|$) "exams";
        ~^/attempts(?:/|$) "attempts";
        ~^/history$ "history";
        ~^/(assets|vendor)/ "assets";
    }
    log_format safe_json escape=json
        '{"timestamp":"$time_iso8601","service":"nginx",'
        '"method":"$request_method","route":"$route_group",'
        '"status":$status,"duration_seconds":$request_time,'
        '"upstream_status":"$upstream_status"}';
    access_log /dev/stdout safe_json;

    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream quiz_app {
        zone quiz_app 64k;
        server app:3000 resolve;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Enable HSTS only when HTTPS is deployed, not on HTTP localhost.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Powered-By;

        location ~ ^/(metrics|stub_status|nginx_status)(/|$) {
            return 404;
        }
        location ~ /\. {
            return 404;
        }
        location / {
            proxy_pass http://quiz_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            # Replace untrusted headers: exactly one reverse proxy is trusted.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }

    # Nginx monitoring endpoint - Docker internal only
    server {
        listen 8082;
        server_name _;

        access_log off;

        location = /stub_status {
            stub_status;
        }

        location / {
            return 404;
        }
    }
}
