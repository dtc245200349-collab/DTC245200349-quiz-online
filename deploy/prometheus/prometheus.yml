
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus tu giam sat
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  # Giam sat Nginx Reverse Proxy
  - job_name: "nginx"
    static_configs:
      - targets:
          - "nginx-exporter:9113"

  - job_name: "mysql"
    static_configs:
      - targets:
          - "mysql-exporter:9104"

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"
