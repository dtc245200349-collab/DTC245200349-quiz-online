
services:
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - frontend
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25

    command:
      - "--nginx.scrape-uri=http://nginx:8082/stub_status"

    networks:
      - backend

    depends_on:
      nginx:
        condition: service_started

    security_opt:
      - no-new-privileges:true

  mysql-exporter:
    image: prom/mysqld-exporter:v0.20.0
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25

    command:
      - "--mysqld.address=db:3306"
      - "--mysqld.username=quiz_monitor"

    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Set MYSQL_EXPORTER_PASSWORD in .env}

    networks:
      - backend

    security_opt:
      - no-new-privileges:true

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped

    mem_limit: 320m
    cpus: 0.5

    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    networks:
      - backend

    security_opt:
      - no-new-privileges:true

volumes:
  prometheus_data:
  grafana_data:
